aid: achates-power
name: Achates Power
description: 'Achates Power is a San Diego, California engine technology company founded
  in 2004 by Dr. James Lemke and John Walton that develops opposed-piston, two-stroke
  compression-ignition engine architecture and licenses the resulting engine designs,
  development tools, simulation software and patents to engine manufacturers and OEMs.
  Its engines target passenger vehicles, medium and heavy-duty commercial trucks, military
  vehicles, and off-road and power-generation applications, and the company has claimed
  fuel-efficiency improvements of as much as 30 percent over conventional engines at
  comparable or better emissions. Achates Power has received U.S. Army TARDEC, Department
  of Energy and ARPA-E funding and partners with engine manufacturers such as Fairbanks
  Morse. It is a privately held hardware and engineering licensing business and publishes
  no public developer program, API, or machine-readable API artifacts.'
